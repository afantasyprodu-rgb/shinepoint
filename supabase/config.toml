# Supabase project config. The function blocks below matter for deployment:
# the Stripe webhook must NOT require a Supabase JWT (Stripe signs it instead).

project_id = "ggcfwwpmclypcexiprro"

[functions.create-payment-intent]
verify_jwt = true

[functions.connect-onboarding]
verify_jwt = true

[functions.identity-verification]
verify_jwt = true

[functions.detailer-dashboard-link]
verify_jwt = true

[functions.get-balance]
verify_jwt = true

[functions.request-payout]
verify_jwt = true

[functions.send-receipt-email]
verify_jwt = true

[functions.detailer-helper]
verify_jwt = true

[functions.release-payouts]
verify_jwt = false

# Cron job — nobody is signed in when it fires, so it authenticates with
# CRON_SECRET inside the function instead of a JWT (same as release-payouts
# and expire-reschedule-offers).
[functions.expire-stale-pending]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# `supabase config push` treats this file as the FULL source of truth for
# every section it touches â€” anything left unset gets reset to the CLI's
# blank defaults, not "leave remote alone". These values restore what was
# already live (captured from the push diff after an earlier push clobbered
# them) so they don't silently reset again on the next push.
[auth]
# detailing-marketplace.vercel.app stopped resolving once shinepoint.app was
# connected as the project's custom domain (Vercel dropped the short alias
# from the project's domain list) â€” shinepoint.app is the real live URL now.
site_url = "https://shinepoint.app/"
additional_redirect_urls = ["https://shinepoint.app/auth/callback", "https://detailing-marketplace.vercel.app/auth/callback", "http://localhost:5180/auth/callback"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Phone OTP is the one paid endpoint that is NOT an edge function â€” the client
# calls signInWithOtp() straight against GoTrue, so the app-level limiter in
# _shared/rateLimit.ts can't see it. These are GoTrue's own limits and are the
# only thing standing between an unauthenticated public form and a per-SMS
# Twilio bill. Tighten sms_sent further once real traffic gives a baseline.
#   sms_sent / email_sent  -> per hour, whole project
#   the rest               -> per 5 minutes, per IP
[auth.rate_limit]
sms_sent = 30
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150
anonymous_users = 30

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

# Supabase's built-in "Magic Link" template only renders {{ .ConfirmationURL
# }} (a clickable link) by default â€” but AuthCard.jsx's email flow always
# expects the user to type a code into OtpBoxInput, never follows a link.
# Override with a template that surfaces {{ .Token }} instead, or users get
# an email with nothing they can actually use.
[auth.email.template.magic_link]
subject = "Your ShinePoint login code"
content_path = "./supabase/templates/magic_link.html"

# Brand-new signups (shouldCreateUser: true) send this "confirmation"
# template instead of magic_link â€” a separate GoTrue email type, same
# ConfirmationURL-only default problem, same fix.
[auth.email.template.confirmation]
subject = "Your ShinePoint signup code"
content_path = "./supabase/templates/confirmation.html"

[storage.vector]
enabled = false

# Custom SMTP so email OTP/signup mail sends from shinepoint.app instead of
# Supabase's default 2-emails/hour dev sender. Secret pulled from the
# SUPABASE_AUTH_SMTP_PASS env var at `supabase config push` time â€” never
# committed here.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "noreply@shinepoint.app"
sender_name = "ShinePoint"

# Phone OTP dropped: Twilio's A2P 10DLC campaign was rejected â€” carriers
# reject SMS consent as a required condition for using the service, which
# an OTP-gated login flow structurally is. Google + email OTP cover signin.
[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.sms.twilio]
enabled = false

[functions.charge-tip]
verify_jwt = true

# Gateway JWT check is not enough on its own (any visitor's anon key
# passes) â€” send-push also authenticates + authorizes + rate-limits inside
# the function. This entry documents the deployment expectation and keeps
# `config push` from resetting it.
[functions.send-push]
verify_jwt = true

[functions.resolve-dispute]
verify_jwt = true

[functions.post-location]
verify_jwt = true

[functions.send-en-route-email]
verify_jwt = true

[functions.send-reschedule-notice]
verify_jwt = true

[functions.send-detailer-recruit-sms]
verify_jwt = true

[functions.send-appointment-reminders]
verify_jwt = false

[functions.extract-flyer-prices]
verify_jwt = true

[functions.customer-helper]
verify_jwt = true

[functions.estimate-photo]
verify_jwt = true

[functions.assistant-chat]
verify_jwt = true

# Agent booking API uses API-key auth inside the function (not a user JWT).
[functions.agent-v1]
verify_jwt = false

# ── Pinned to match what is already deployed ──────────────────────────────
# These three ran with verify_jwt = false but were never written down, so a
# plain `functions deploy` would have silently flipped them to requiring a
# JWT and broken them. Same trap the send-push entry above documents.

# The customer responds to a reschedule offer from an emailed/texted link,
# signed in or not — the one-time token in the URL is the auth.
[functions.respond-to-reschedule]
verify_jwt = false

# Cron: nobody is signed in when it fires; CRON_SECRET is the auth.
[functions.expire-reschedule-offers]
verify_jwt = false

# Public read-only MCP endpoint for outside agents — no user to have a JWT.
[functions.mcp-server]
verify_jwt = false

# Public concierge widget (Bo) on the landing page — anonymous visitors have
# no JWT to send, so the gateway check must stay off. Pinned here so a plain
# `functions deploy` / `config push` can't flip it on and break the widget
# for every logged-out visitor. Abuse is bounded inside the function instead
# (per-IP rate limits) and CORS is APP_ORIGIN-locked via _shared/cors.ts.
[functions.concierge-chat]
verify_jwt = false

# Captures the remainder of a deposit booking after the work is done.
# Authenticates the caller and checks they're on the booking before charging.
[functions.charge-balance]
verify_jwt = true

# Customer cancelling their own booking — issues a real Stripe refund, so
# it authenticates the caller and checks booking ownership inside the
# function on top of this gateway check.
[functions.cancel-booking]
verify_jwt = true

[functions.create-detailer-charge-intent]
verify_jwt = true

[functions.get-detailer-charge-intent]
verify_jwt = false
