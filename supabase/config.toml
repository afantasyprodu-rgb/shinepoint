# Supabase project config. The function blocks below matter for deployment:
# the Stripe webhook must NOT require a Supabase JWT (Stripe signs it instead).

project_id = "ggcfwwpmclypcexiprro"

[functions.create-payment-intent]
verify_jwt = true

[functions.connect-onboarding]
verify_jwt = true

[functions.identity-verification]
verify_jwt = true

[functions.detailer-dashboard-link]
verify_jwt = true

[functions.get-balance]
verify_jwt = true

[functions.request-payout]
verify_jwt = true

[functions.send-receipt-email]
verify_jwt = true

[functions.release-payouts]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# `supabase config push` treats this file as the FULL source of truth for
# every section it touches — anything left unset gets reset to the CLI's
# blank defaults, not "leave remote alone". These values restore what was
# already live (captured from the push diff after an earlier push clobbered
# them) so they don't silently reset again on the next push.
[auth]
# detailing-marketplace.vercel.app stopped resolving once shinepoint.app was
# connected as the project's custom domain (Vercel dropped the short alias
# from the project's domain list) — shinepoint.app is the real live URL now.
site_url = "https://shinepoint.app/"
additional_redirect_urls = ["https://shinepoint.app/auth/callback", "https://detailing-marketplace.vercel.app/auth/callback", "http://localhost:5180/auth/callback"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Phone OTP is the one paid endpoint that is NOT an edge function — the client
# calls signInWithOtp() straight against GoTrue, so the app-level limiter in
# _shared/rateLimit.ts can't see it. These are GoTrue's own limits and are the
# only thing standing between an unauthenticated public form and a per-SMS
# Twilio bill. Tighten sms_sent further once real traffic gives a baseline.
#   sms_sent / email_sent  -> per hour, whole project
#   the rest               -> per 5 minutes, per IP
[auth.rate_limit]
sms_sent = 30
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150
anonymous_users = 30

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

# Supabase's built-in "Magic Link" template only renders {{ .ConfirmationURL
# }} (a clickable link) by default — but AuthCard.jsx's email flow always
# expects the user to type a code into OtpBoxInput, never follows a link.
# Override with a template that surfaces {{ .Token }} instead, or users get
# an email with nothing they can actually use.
[auth.email.template.magic_link]
subject = "Your ShinePoint login code"
content_path = "./supabase/templates/magic_link.html"

# Brand-new signups (shouldCreateUser: true) send this "confirmation"
# template instead of magic_link — a separate GoTrue email type, same
# ConfirmationURL-only default problem, same fix.
[auth.email.template.confirmation]
subject = "Your ShinePoint signup code"
content_path = "./supabase/templates/confirmation.html"

[storage.vector]
enabled = false

# Custom SMTP so email OTP/signup mail sends from shinepoint.app instead of
# Supabase's default 2-emails/hour dev sender. Secret pulled from the
# SUPABASE_AUTH_SMTP_PASS env var at `supabase config push` time — never
# committed here.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "noreply@shinepoint.app"
sender_name = "ShinePoint"

# Phone OTP dropped: Twilio's A2P 10DLC campaign was rejected — carriers
# reject SMS consent as a required condition for using the service, which
# an OTP-gated login flow structurally is. Google + email OTP cover signin.
[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.sms.twilio]
enabled = false

[functions.charge-tip]
verify_jwt = true

# Gateway JWT check is not enough on its own (any visitor's anon key
# passes) — send-push also authenticates + authorizes + rate-limits inside
# the function. This entry documents the deployment expectation and keeps
# `config push` from resetting it.
[functions.send-push]
verify_jwt = true

[functions.resolve-dispute]
verify_jwt = true

[functions.post-location]
verify_jwt = true

[functions.send-en-route-email]
verify_jwt = true

[functions.send-appointment-reminders]
verify_jwt = false

[functions.extract-flyer-prices]
verify_jwt = true
