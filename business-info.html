<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pre-paint theme: sets .dark before first paint so dark-mode users
         never see a light flash (mirrors ThemeContext.initialTheme()). -->
    <script src="/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ShinePoint business registration, contact, and service information — a static, JavaScript-free page for automated verification." />
    <meta name="theme-color" content="#de0067" />
    <!-- Fonts as parallel-fetchable <link>s (not a CSS @import — that was
         a sequential, render-blocking chain: main.css -> Google's CSS ->
         the actual woff2 files). preconnect opens the connection to both
         hosts before the stylesheet request even lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS ignores manifest.json's `display: standalone` — Safari only
         reads these Apple-specific tags to launch without browser chrome
         when added to the Home Screen. Keep in sync with manifest.json's
         name/theme_color if those ever change. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShinePoint" />
    <title>Business Information — ShinePoint</title>
    <!-- Structured data for search/AI answer engines (not shown to users) —
         lets an AI assistant or AI Overview answer "mobile detailer near
         me" with ShinePoint's name, contact, and service directly, instead
         of only linking to the page. Keep NAP (name/address/phone) in sync
         with footerContact in strings.js and /business-info — mismatched
         contact info across these was exactly what tripped Twilio's
         verification earlier, and the same consistency matters here. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "additionalType": "https://schema.org/AutomotiveBusiness",
        "name": "ShinePoint",
        "legalName": "Richard David Rodriguez Padilla, DBA ShinePoint",
        "url": "https://shinepoint.app",
        "logo": "https://shinepoint.app/favicon.svg",
        "description": "LA's vetted mobile car detailers, booked in minutes. Photo-proofed jobs, insured options, detailing at your door.",
        "email": "shinepoint.support@gmail.com",
        "telephone": "+12135347417",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "734 W Colden Ave",
          "addressLocality": "Los Angeles",
          "addressRegion": "CA",
          "postalCode": "90044",
          "addressCountry": "US"
        },
        "areaServed": {
          "@type": "City",
          "name": "Los Angeles"
        },
        "sameAs": ["https://shinepoint.app/business-info"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Mobile Detailing Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Mobile Car Detailing",
                "description": "On-demand mobile car detailing at the customer's home, office, or curb, performed by independent vetted detailers.",
                "areaServed": "Los Angeles, CA",
                "provider": { "@type": "LocalBusiness", "name": "ShinePoint" }
              }
            }
          ]
        }
      }
    </script>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
